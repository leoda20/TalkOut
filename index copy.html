<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multilanguage Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #lang-toggle {
      float: right;
      padding: 6px 10px;
      cursor: pointer;
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>

  <script async src="https://tally.so/widgets/embed.js"></script>

    <!-- Meta Pixel Code -->

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

</head>
<body>
  <button id="lang-toggle">PT</button>

  <h1 data-key="title">Welcome!</h1>
  <p data-key="description">This is an example of a multilingual website.</p>

  <script>
    const translations = {
      es: {
        title: "Welcome!",
        description: "This is an example of a multilingual website.",
      },
      pt: {
        title: "Bem-vindo!",
        description: "Este é um exemplo de site multilíngue.",
      },
    };

    // Load saved language or detect browser language
    let currentLang = localStorage.getItem("lang") || 
                      (navigator.language.startsWith("pt") ? "pt" : "es");

    const toggleBtn = document.getElementById("lang-toggle");

    function updateLanguage(lang) {
      document.querySelectorAll("[data-key]").forEach(el => {
        const key = el.getAttribute("data-key");
        el.textContent = translations[lang][key];
      });
      toggleBtn.textContent = lang === "es" ? "PT" : "ES";
      localStorage.setItem("lang", lang);
    }

    toggleBtn.addEventListener("click", () => {
      currentLang = currentLang === "es" ? "pt" : "es";
      updateLanguage(currentLang);
    });

    // Apply saved language on load
    updateLanguage(currentLang);
  </script>
</body>
</html>
