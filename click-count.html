<body>

    <button id="clickButton" class="track-click" data-label="Header Click">Click me</button>
    <h2>Contador de Cliques 5</h2>

    <script>
        const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyTkT7nBOltSOSN2hHsC09AePBSeKcUnR_3pnOmIlxGBUq14gKslvHKNqbm_MXYza-t/exec";

        document.addEventListener("DOMContentLoaded", () => {
        const button = document.getElementById("clickButton");

        button.addEventListener("click", () => {
            const formData = new FormData();
            formData.append("button", button.dataset.label || "Main CTA");
            formData.append("page", window.location.pathname);

            fetch(WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
            });

            console.log("Click sent!");
        });
        });
    </script>
