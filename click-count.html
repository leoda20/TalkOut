<!DOCTYPE html>
<html lang="zxx">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bootstrap grid css -->

    <!-- font awesome css -->
    <link rel="stylesheet" href="css/plugins/font-awesome.min.css">
    <!-- font awesome css -->

    <!-- swiper css -->

    <!-- page name -->
    <title>Torna-te um Moderador - TalkOut
    </title>
    <link rel="icon" type="image/png" href="img/photo/new-favicon.png">

   
    


</head>

<body>

  <button id="clickButton" class="track-click" data-label="Header Click">Click me</button>
  <h2>Contador de Cliques 3</h2>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby3Zt1alFABeDU9-_KNiwI_YuYmkBDLMcJqMnHuClEq0kzydTTO1WkQZUqMaluUcv8k/exec";

    document.addEventListener("DOMContentLoaded", () => {
      const button = document.getElementById("clickButton");

      button.addEventListener("click", () => {
        const formData = new FormData();
        formData.append("button", button.dataset.label || "Main CTA");
        formData.append("page", window.location.pathname);

        fetch(WEBAPP_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        console.log("Click sent!");
      });
    });
  </script>
