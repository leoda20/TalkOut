<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Login</title>

    <!-- Supabase + Auth UI CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/auth-ui@0.5.6/dist/umd/index.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@supabase/auth-ui@0.5.6/dist/umd/default.css"
    />

    <script async src="https://tally.so/widgets/embed.js"></script>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1538178294125160&ev=PageView&noscript=1"
    /></noscript>

  </head>

  <body>
    <!-- Put env.js before the modules so window.__ENV__ is available -->
    <script src="/js/auth/env.js"></script>

    <!-- Import the UI wiring helper as a module -->
    <script type="module">
      import { initAuthUI } from '/js/auth/ui.js'

      // Example: wire forms with these IDs
      initAuthUI({
        loginFormId: 'login-form',
        signupFormId: 'signup-form',
        logoutButtonId: 'logout-btn',
        statusElementId: 'auth-status'
      })
    </script>


<!-- Authentication status -->
    <div id="auth-status" aria-live="polite"></div>

    <!-- Login form -->
    <form id="login-form">
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>

    <!-- Signup form -->
    <form id="signup-form">
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>

    <!-- Sign-out button -->
    <button id="logout-btn">Sign Out</button>
  </body>
</html>
