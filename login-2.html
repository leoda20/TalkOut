<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Login</title>

    <!-- Supabase + Auth UI CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/auth-ui@0.5.6/dist/umd/index.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@supabase/auth-ui@0.5.6/dist/umd/default.css"
    />
  </head>

  <body>
    <!-- Put env.js before the modules so window.__ENV__ is available -->
    <script src="/js/auth/env.js"></script>

    <!-- Import the UI wiring helper as a module -->
    <script type="module">
      import { initAuthUI } from '/js/auth/ui.js'

      // Example: wire forms with these IDs
      initAuthUI({
        loginFormId: 'login-form',
        signupFormId: 'signup-form',
        logoutButtonId: 'logout-btn',
        statusElementId: 'auth-status'
      })
    </script>


<!-- Authentication status -->
    <div id="auth-status" aria-live="polite"></div>

    <!-- Login form -->
    <form id="login-form">
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>

    <!-- Signup form -->
    <form id="signup-form">
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>

    <!-- Sign-out button -->
    <button id="logout-btn">Sign Out</button>
  </body>
</html>
